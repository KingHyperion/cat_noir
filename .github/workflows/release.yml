name: Build release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyinstaller

      - run: pyinstaller --onefile --name cat_noir main.py

      - name: Rename output
        shell: bash
        run: |
          mkdir out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/cat_noir.exe out/cat_noir-windows.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp dist/cat_noir out/cat_noir-macos
          else
            cp dist/cat_noir out/cat_noir-linux
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
